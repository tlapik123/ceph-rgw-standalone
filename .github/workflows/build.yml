name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Ceph version from Containerfile
        run: echo "CEPH_VERSION=$(grep -oP 'ceph:\Kv[0-9.]+' Containerfile)" >> "$GITHUB_ENV"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: Containerfile
          platforms: linux/amd64, linux/arm64
          image: ceph-rgw-standalone
          tags: latest ${{ env.CEPH_VERSION }}

      - name: Smoke test
        env:
          AWS_ACCESS_KEY_ID: localtest
          AWS_SECRET_ACCESS_KEY: localtest-secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:7480
        run: |
          trap 'podman logs rgw' ERR
          podman run -d --name rgw -p 127.0.0.1:7480:7480 localhost/ceph-rgw-standalone:latest
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7480/ && break; sleep 1; done
          aws s3 mb s3://smoke
          aws s3 cp Containerfile s3://smoke/Containerfile
          aws s3 cp s3://smoke/Containerfile - | diff - Containerfile
          aws s3 ls s3://smoke

      - name: Push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
