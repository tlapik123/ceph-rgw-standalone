[global]
    run dir = /data/run
    crash dir = /data/run
    admin socket =

[client]
    rgw backend store = posix
    rgw config store = dbstore
    rgw posix base path = /data/objects
    rgw posix userdb dir = /data/db
    rgw posix database root = /data/db
    dbstore config uri = file:///data/db/config.db
    rgw frontends = beast port=7480
    rgw relaxed region enforcement = true
